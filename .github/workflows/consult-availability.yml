name: Booking free-busy test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consult-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate API syntax
        run: node --check api/consult-availability.js
      - name: Run calendar isolation and availability tests
        run: node --test tests/consult-availability.test.js
